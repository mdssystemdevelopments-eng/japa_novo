services:
  - type: web
    name: japa-insufilm-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && node scripts/render-build.mjs
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@japainsufilm.local
      - key: SEED_ADMIN_PASSWORD
        sync: false
